name: Build VST plugins

on:
  push:
    paths:
      - "**/vst/**"
      - ".github/workflows/build-vst.yml"
  pull_request:
    paths:
      - "**/vst/**"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux JUCE dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev \
            libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev

      - name: Configure
        run: cmake -S loam-eight-sub/vst -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build DSP self-test
        run: cmake --build build --config Release --target EngineTest

      - name: Run DSP self-test
        shell: bash
        run: |
          exe=$(find build -type f \( -iname "EngineTest" -o -iname "EngineTest.exe" \) | head -n1)
          echo "running $exe"
          "$exe"

      - name: Build plugin (VST3 + Standalone)
        run: cmake --build build --config Release --target LoamEightSub_VST3 LoamEightSub_Standalone

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: loam-eight-sub-${{ matrix.os }}
          path: build/LoamEightSub_artefacts/**
          if-no-files-found: error
