name: Release

# Push a tag like v1.0.0 to build every synth in the bundle (each */vst/
# folder) on all three platforms and publish a GitHub release with one zip
# per synth, a Loam-Synth-Bundle zip holding all of them, and a Windows
# installer. Run it by hand (workflow_dispatch) to build everything as
# workflow artifacts without publishing, e.g. to try the installer.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version stamped into the test installer"
        default: "0.0.0"

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        # Pinned rather than ubuntu-latest so a runner image migration can't
        # silently break the apt package list below on release day.
        os: [ubuntu-24.04, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux JUCE dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev \
            libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev

      - name: Build, test and package every synth
        shell: bash
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          platform=$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
          version=${VERSION#v}
          mkdir -p dist stage

          for cmakelists in */vst/CMakeLists.txt; do
            src=$(dirname "$cmakelists")
            synth=$(basename "$(dirname "$src")")
            echo "::group::$synth"

            cmake -S "$src" -B "build/$synth" -DCMAKE_BUILD_TYPE=Release
            cmake --build "build/$synth" --config Release --parallel

            test_exe=$(find "build/$synth" -type f \( -iname "EngineTest" -o -iname "EngineTest.exe" \) | head -n1)
            if [ -n "$test_exe" ]; then "$test_exe"; fi

            artefacts=$(find "build/$synth" -type d -path "*_artefacts/Release" | head -n1)
            mkdir -p "stage/$synth"
            cp -R "$artefacts/VST3" "stage/$synth/"
            # MSVC drops import libs next to the .vst3; they're build leftovers.
            find "stage/$synth/VST3" -maxdepth 1 \( -name '*.lib' -o -name '*.exp' \) -delete
            if [ -d "$artefacts/Standalone" ]; then cp -R "$artefacts/Standalone" "stage/$synth/"; fi
            cp "$src/LICENSE" "stage/$synth/LICENSE.txt"

            # loam-eight-sub -> Loam-Synth-Eight-Sub. Bundle files start with
            # "1Bundle" so GitHub's alphabetical asset list shows them first.
            pretty="Loam-Synth-$(echo "${synth#loam-}" | perl -pe 's/(^|-)(\w)/$1\u$2/g')"

            # On Windows each synth's zip also carries its own installer.
            if [ "$RUNNER_OS" = "Windows" ]; then
              name=$(echo "$synth" | perl -pe 's/(^|-)(\w)/$1\u$2/g; s/-/ /g')   # Loam Eight Sub
              mkdir -p "solo/$synth" && cp -R "stage/$synth" "solo/$synth/"
              bash installer/windows/build-installer.sh "$version" "solo/$synth" "stage/$synth" \
                "$name" "${name// /}" "$pretty-Setup-$version"
            fi

            (cd stage && cmake -E tar cf "../dist/$pretty-$version-$platform.zip" --format=zip "$synth")
            echo "::endgroup::"
          done

          mkdir -p bundle && cp -R stage bundle/Loam-Synth-Bundle
          # The bundle has its own installer; drop the per-synth ones from its zip.
          find bundle -name '*-Setup-*.exe' -delete
          (cd bundle && cmake -E tar cf "../dist/1Bundle-Loam-Synth-$version-$platform.zip" --format=zip Loam-Synth-Bundle)
          ls -l dist

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: bash
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          bash installer/windows/build-installer.sh "${VERSION#v}" stage dist
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.exe
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notes.md <<'EOF'
          ## Downloads

          - **`1Bundle-Loam-Synth-Setup-<version>.exe`** — Windows installer for every synth (recommended on Windows)
          - **`1Bundle-Loam-Synth-<version>-<platform>.zip`** — every Loam synth in one archive
          - **`Loam-Synth-<Synth>-<version>-<platform>.zip`** — a single synth (the Windows zip includes its own installer)

          Each archive holds the VST3 plugin and a standalone app for each synth.

          ## Install

          **Windows:** run the installer — the bundle one, or the one inside a single
          synth's zip. It puts the plugins in `C:\Program Files\Common Files\VST3\Loam`,
          adds the standalone apps to the Start menu, and upgrades an existing install
          in place when you run a newer version. The bundle and single-synth installers
          share that folder, so installing both never shows a plugin twice. Windows SmartScreen may warn because the installer
          isn't code-signed: choose **More info -> Run anyway**.

          **Manual install:** copy the `.vst3` folder/file into your plugin folder and rescan in your DAW:

          | Platform | VST3 folder |
          |---|---|
          | Windows | `C:\Program Files\Common Files\VST3` |
          | macOS | `~/Library/Audio/Plug-Ins/VST3` |
          | Linux | `~/.vst3` |

          macOS builds are not signed or notarized. If macOS refuses to load them, run
          `xattr -dr com.apple.quarantine "<path to the .vst3 or .app>"` once.
          EOF

          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.exe \
            --repo "$GITHUB_REPOSITORY" \
            --title "Loam Synth VST $GITHUB_REF_NAME" \
            --notes-file notes.md
